<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0f0c" />
  <meta name="description" content="Shepherd — discipleship management for Gethsemane Ministry Youth Ministry." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Shepherd" />
  <link rel="apple-touch-icon" href="/sidebar-logo.png" />
  <title>Shepherd — Discipleship Management</title>
  <script>
    /* Apply the saved theme before first paint to avoid a flash. Dark is the
       default; only an explicit "light" choice switches modes. */
    (function () {
      try {
        var t = localStorage.getItem("shepherd.theme");
        if (t !== "light") document.documentElement.classList.add("dark");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
